<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191d24" />
      <stop offset="100%" stop-color="#121519" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="1" y="1" width="848" height="298" rx="4" fill="url(#gridBg)" stroke="#292f39" stroke-width="1.5" />
  
  <!-- Terminal Header Bar -->
  <rect x="1" y="1" width="848" height="34" fill="#14171d" />
  <line x1="1" y1="35" x2="849" y2="35" stroke="#292f39" stroke-width="1" />

  <!-- Terminal Buttons -->
  <circle cx="20" cy="18" r="4.5" fill="#e06c75" />
  <circle cx="36" cy="18" r="4.5" fill="#e5c07b" />
  <circle cx="52" cy="18" r="4.5" fill="#98c379" />

  <text x="74" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#f0f6fc">
    mkb-grid // Bespoke Infrastructure Control Node &amp; TUI
  </text>
  <text x="830" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#58a6ff">
    v1.0 (Shell) ➔ v2.0 (Rust + Podman)
  </text>

  <!-- Services Dashboard Subheader -->
  <rect x="20" y="48" width="810" height="26" rx="2" fill="#202630" stroke="#2d3542" stroke-width="1" />
  <text x="32" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="bold" fill="#d4a72c">
    LOCAL SERVICES DASHBOARD
  </text>
  <text x="818" y="65" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
    NODES: 4 | RUNNING: 3 | COOLDOWN: 1 | PORTS: AUTO-SCAN (ss)
  </text>

  <!-- Service Row 1: PostgreSQL -->
  <g transform="translate(20, 84)">
    <rect x="0" y="0" width="810" height="36" rx="2" fill="#14171c" stroke="#232832" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#2ea043" />
    <text x="32" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#f0f6fc">
      mkb_svc_postgres_5432
    </text>
    <text x="260" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
      postgres:16-alpine
    </text>
    <text x="440" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#58a6ff">
      5432:5432/tcp
    </text>
    <text x="580" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#d4a72c">
      Btrfs Snap: OK (subvol_01)
    </text>
    <text x="800" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#2ea043">
      UP 4h
    </text>
  </g>

  <!-- Service Row 2: Redis -->
  <g transform="translate(20, 126)">
    <rect x="0" y="0" width="810" height="36" rx="2" fill="#14171c" stroke="#232832" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#2ea043" />
    <text x="32" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#f0f6fc">
      mkb_svc_redis_6379
    </text>
    <text x="260" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
      redis:7-alpine
    </text>
    <text x="440" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#58a6ff">
      6379:6379/tcp
    </text>
    <text x="580" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
      In-Memory Cache Pool
    </text>
    <text x="800" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#2ea043">
      UP 4h
    </text>
  </g>

  <!-- Service Row 3: Kafka -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="810" height="36" rx="2" fill="#14171c" stroke="#232832" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#2ea043" />
    <text x="32" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#f0f6fc">
      mkb_svc_kafka_9092
    </text>
    <text x="260" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
      apache/kafka:3.7.0
    </text>
    <text x="440" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#58a6ff">
      9092:9092/tcp
    </text>
    <text x="580" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#d4a72c">
      KRaft Protocol (No ZK)
    </text>
    <text x="800" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#2ea043">
      UP 2h
    </text>
  </g>

  <!-- Service Row 4: RabbitMQ -->
  <g transform="translate(20, 210)">
    <rect x="0" y="0" width="810" height="36" rx="2" fill="#14171c" stroke="#232832" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#6e7681" />
    <text x="32" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#8b949e">
      mkb_svc_rabbitmq_5672
    </text>
    <text x="260" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6e7681">
      rabbitmq:3-management
    </text>
    <text x="440" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6e7681">
      5672:5672/tcp
    </text>
    <text x="580" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6e7681">
      Management UI: 15672
    </text>
    <text x="800" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
      EXITED (0)
    </text>
  </g>

  <!-- Bottom Badges / Capabilities Bar -->
  <line x1="20" y1="260" x2="830" y2="260" stroke="#232832" stroke-width="1" />
  
  <text x="24" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
    CAPABILITIES:
  </text>
  
  <rect x="110" y="268" width="130" height="18" rx="2" fill="#202630" />
  <text x="175" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="bold" fill="#d4a72c">
    BTRFS COW ROLLBACK
  </text>

  <rect x="250" y="268" width="130" height="18" rx="2" fill="#202630" />
  <text x="315" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="bold" fill="#58a6ff">
    TCP PORT DISCOVERY
  </text>

  <rect x="390" y="268" width="130" height="18" rx="2" fill="#202630" />
  <text x="455" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="bold" fill="#e8eaed">
    PANORAMA LOG STREAM
  </text>

  <rect x="530" y="268" width="140" height="18" rx="2" fill="#202630" />
  <text x="600" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="bold" fill="#8b949e">
    DOCKER COMPOSE SYNC
  </text>

  <text x="826" y="281" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="bold" fill="#d4a72c">
    [ REPOSITÓRIO ↗ ]
  </text>
</svg>
